plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.financetrackernative'
version = '0.1.0'

android {
  namespace "expo.modules.financetrackernative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.security:security-crypto:1.1.0"
}
