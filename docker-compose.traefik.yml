version: '3.8'

# Standalone deployment for running behind an existing Traefik reverse proxy
# (e.g. the SpaceInvaderOne-style stack with an external `t2_proxy` network and
# a wildcard cert via DNS challenge). No ports are published on the host —
# only Traefik reaches the app, over the shared external network. db/redis
# are internal-only.
#
# Usage:
#   cp .env.example .env
#   # Set in .env:
#   #   TRAEFIK_DOMAIN=finance.yourdomain.com
#   #   REACT_APP_API_URL=https://finance.yourdomain.com
#   #   BACKEND_URL=https://finance.yourdomain.com
#   #   FRONTEND_URL=https://finance.yourdomain.com
#   #   ALLOWED_ORIGINS=https://finance.yourdomain.com
#   docker compose -f docker-compose.traefik.yml pull
#   docker compose -f docker-compose.traefik.yml up -d

services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-financeuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-financepass}
      - POSTGRES_DB=${POSTGRES_DB:-financedb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeuser -d financedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance-network

  backend:
    image: ghcr.io/poornachandratejasvi/finance_tracker-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-financeuser}:${POSTGRES_PASSWORD:-financepass}@db:5432/${POSTGRES_DB:-financedb}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - APP_VERSION=${IMAGE_TAG:-latest}
    volumes:
      - backend_uploads:/app/uploads
      - gmail_credentials:/app/credentials
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --log-level info
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=backend"
    networks:
      - finance-network
      - t2_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance-backend-rtr.entrypoints=https"
      - "traefik.http.routers.finance-backend-rtr.rule=Host(`${TRAEFIK_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || PathPrefix(`/openapi.json`))"
      - "traefik.http.routers.finance-backend-rtr.tls=true"
      - "traefik.http.routers.finance-backend-rtr.priority=10"
      - "traefik.http.routers.finance-backend-rtr.service=finance-backend-svc"
      - "traefik.http.services.finance-backend-svc.loadbalancer.server.port=8000"

  worker:
    image: ghcr.io/poornachandratejasvi/finance_tracker-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-financeuser}:${POSTGRES_PASSWORD:-financepass}@db:5432/${POSTGRES_DB:-financedb}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    volumes:
      - backend_uploads:/app/uploads
      - gmail_credentials:/app/credentials
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app:celery_app worker --loglevel=info --concurrency=2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=worker"
    networks:
      - finance-network

  beat:
    image: ghcr.io/poornachandratejasvi/finance_tracker-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-financeuser}:${POSTGRES_PASSWORD:-financepass}@db:5432/${POSTGRES_DB:-financedb}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    volumes:
      - backend_uploads:/app/uploads
      - gmail_credentials:/app/credentials
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app:celery_app beat --loglevel=info
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=beat"
    networks:
      - finance-network

  frontend:
    image: ghcr.io/poornachandratejasvi/finance_tracker-frontend:${IMAGE_TAG:-latest}
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
    depends_on:
      - backend
    networks:
      - finance-network
      - t2_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance-frontend-rtr.entrypoints=https"
      - "traefik.http.routers.finance-frontend-rtr.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.finance-frontend-rtr.tls=true"
      - "traefik.http.routers.finance-frontend-rtr.priority=1"
      - "traefik.http.routers.finance-frontend-rtr.service=finance-frontend-svc"
      - "traefik.http.services.finance-frontend-svc.loadbalancer.server.port=3000"

  # Ensures the `paperless` database exists on the SAME Postgres server the finance
  # app already uses -- avoids running a second Postgres instance just for this.
  # Idempotent (safe to leave in the stack permanently): a no-op after the first
  # run, on both a fresh volume and an existing one.
  paperless-db-init:
    image: postgres:15-alpine
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:-financepass}
    entrypoint:
      - sh
      - -c
      - >
        psql -h db -U ${POSTGRES_USER:-financeuser} -d ${POSTGRES_DB:-financedb} -tc
        "SELECT 1 FROM pg_database WHERE datname = '${PAPERLESS_DB_NAME:-paperless}'" | grep -q 1 ||
        psql -h db -U ${POSTGRES_USER:-financeuser} -d ${POSTGRES_DB:-financedb} -c
        "CREATE DATABASE ${PAPERLESS_DB_NAME:-paperless}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finance-network

  # Document archive for scanned receipts (see backend/app/services/paperless_service.py) --
  # a separate, general-purpose document management app, not something this project builds.
  # Shares this stack's Postgres (own database, see paperless-db-init above) and Redis
  # (own logical DB index) instead of running its own, since this is a single small VM.
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    environment:
      - PAPERLESS_REDIS=redis://redis:6379/1
      - PAPERLESS_DBHOST=db
      - PAPERLESS_DBNAME=${PAPERLESS_DB_NAME:-paperless}
      - PAPERLESS_DBUSER=${POSTGRES_USER:-financeuser}
      - PAPERLESS_DBPASS=${POSTGRES_PASSWORD:-financepass}
      - PAPERLESS_URL=https://${PAPERLESS_TRAEFIK_DOMAIN}
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER:-admin}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
      - PAPERLESS_TIME_ZONE=${PAPERLESS_TIME_ZONE:-Asia/Kolkata}
      - PAPERLESS_OCR_LANGUAGE=${PAPERLESS_OCR_LANGUAGE:-eng}
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - paperless_export:/usr/src/paperless/export
      - paperless_consume:/usr/src/paperless/consume
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      paperless-db-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=paperless"
    networks:
      - finance-network
      - t2_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless-rtr.entrypoints=https"
      - "traefik.http.routers.paperless-rtr.rule=Host(`${PAPERLESS_TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.paperless-rtr.tls=true"
      - "traefik.http.routers.paperless-rtr.priority=1"
      - "traefik.http.routers.paperless-rtr.service=paperless-svc"
      - "traefik.http.services.paperless-svc.loadbalancer.server.port=8000"

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  gmail_credentials:
  paperless_data:
  paperless_media:
  paperless_export:
  paperless_consume:

networks:
  finance-network:
    driver: bridge
  t2_proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-t2_proxy}
