server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # CRA content-hashes every filename here, so a new build always ships
    # under a new path -- safe to cache aggressively forever.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The one file that must NEVER be cached: it's what points the browser
    # at the current build's hashed asset filenames. A stale cached copy of
    # THIS file is exactly what made a fresh deploy look like it hadn't
    # happened (see the fixed-path "bundle.js" dev-server problem this
    # replaces).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: any client-side route (e.g. /transactions, /investments)
    # that isn't a real file on disk serves index.html, letting React Router
    # take over.
    location / {
        try_files $uri /index.html;
    }
}
