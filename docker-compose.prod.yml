version: '3.8'

# Quick-start deployment — pulls the prebuilt images published to GHCR by
# .github/workflows/docker-build.yml instead of building from source. No
# checkout of backend/frontend needed beyond this file and your .env.
#
# Usage:
#   cp .env.example .env   # fill in secrets first
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Pin a specific release instead of latest: IMAGE_TAG=v0.2.0 docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-financeuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-financepass}
      - POSTGRES_DB=${POSTGRES_DB:-financedb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeuser -d financedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance-network

  backend:
    image: ghcr.io/poornachandratejasvi/finance_tracker-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-financeuser}:${POSTGRES_PASSWORD:-financepass}@db:5432/${POSTGRES_DB:-financedb}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - APP_VERSION=${IMAGE_TAG:-latest}
    volumes:
      - backend_uploads:/app/uploads
      - gmail_credentials:/app/credentials
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --log-level info
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=backend"
    networks:
      - finance-network

  worker:
    image: ghcr.io/poornachandratejasvi/finance_tracker-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-financeuser}:${POSTGRES_PASSWORD:-financepass}@db:5432/${POSTGRES_DB:-financedb}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    volumes:
      - backend_uploads:/app/uploads
      - gmail_credentials:/app/credentials
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app:celery_app worker --loglevel=info --concurrency=2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=worker"
    networks:
      - finance-network

  beat:
    image: ghcr.io/poornachandratejasvi/finance_tracker-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-financeuser}:${POSTGRES_PASSWORD:-financepass}@db:5432/${POSTGRES_DB:-financedb}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    volumes:
      - backend_uploads:/app/uploads
      - gmail_credentials:/app/credentials
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app:celery_app beat --loglevel=info
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=beat"
    networks:
      - finance-network

  frontend:
    image: ghcr.io/poornachandratejasvi/finance_tracker-frontend:${IMAGE_TAG:-latest}
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - finance-network

  # Ensures the `paperless` database exists on this SAME Postgres server -- avoids
  # running a second Postgres instance just for Paperless-ngx. Idempotent (safe to
  # leave permanently): a no-op after the first run.
  paperless-db-init:
    image: postgres:15-alpine
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:-financepass}
    entrypoint:
      - sh
      - -c
      - >
        psql -h db -U ${POSTGRES_USER:-financeuser} -d ${POSTGRES_DB:-financedb} -tc
        "SELECT 1 FROM pg_database WHERE datname = '${PAPERLESS_DB_NAME:-paperless}'" | grep -q 1 ||
        psql -h db -U ${POSTGRES_USER:-financeuser} -d ${POSTGRES_DB:-financedb} -c
        "CREATE DATABASE ${PAPERLESS_DB_NAME:-paperless}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finance-network

  # Document archive for scanned receipts (see backend/app/services/paperless_service.py).
  # No Traefik here -- published directly on the host at PAPERLESS_PORT (default 8010).
  # Reachable at http://<this-host>:8010, or set PAPERLESS_URL if you put your own
  # reverse proxy in front of it.
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    environment:
      - PAPERLESS_REDIS=redis://redis:6379/1
      - PAPERLESS_DBHOST=db
      - PAPERLESS_DBNAME=${PAPERLESS_DB_NAME:-paperless}
      - PAPERLESS_DBUSER=${POSTGRES_USER:-financeuser}
      - PAPERLESS_DBPASS=${POSTGRES_PASSWORD:-financepass}
      - PAPERLESS_URL=${PAPERLESS_URL:-http://localhost:${PAPERLESS_PORT:-8010}}
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER:-admin}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
      - PAPERLESS_TIME_ZONE=${PAPERLESS_TIME_ZONE:-Asia/Kolkata}
      - PAPERLESS_OCR_LANGUAGE=${PAPERLESS_OCR_LANGUAGE:-eng}
    ports:
      - "${PAPERLESS_PORT:-8010}:8000"
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - paperless_export:/usr/src/paperless/export
      - paperless_consume:/usr/src/paperless/consume
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      paperless-db-init:
        condition: service_completed_successfully
    networks:
      - finance-network

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  gmail_credentials:
  paperless_data:
  paperless_media:
  paperless_export:
  paperless_consume:

networks:
  finance-network:
    driver: bridge
