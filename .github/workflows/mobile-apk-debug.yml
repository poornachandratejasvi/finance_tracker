name: Build Android APK

# Produces a RELEASE-type APK for the Expo app in mobile/ -- despite the workflow's name
# (kept from when this built a true debug APK), a "debug" build type only ever loads its
# JS from a Metro server on your dev machine (localhost:8081 over USB, or your computer's
# IP over Wi-Fi) rather than bundling it into the APK, so it's unusable once installed
# standalone on a phone ("Unable to load script... Make sure you're running Metro").
# "release" is the React Native Gradle plugin's recognized convention for bundling JS
# into the APK's assets at build time, needed for a sideloaded install to actually work.
#
# Still needs no code-signing ceremony to sideload (unlike iOS): the generated
# android/app/build.gradle points buildTypes.release at the same well-known Gradle debug
# keystore as buildTypes.debug (confirmed in the real prebuilt project, not assumed) --
# there's no Play-Store-grade production keystore to manage since this is never
# distributed there, and minifyEnabled/shrinkResources both default to false, so there's
# no ProGuard-related crash risk either.
#
# Runs on ubuntu-latest (no macOS needed -- Android tooling is cross-platform), so this is
# both cheaper and faster than the iOS workflow. Manual trigger only, for consistency with
# the iOS workflow, though there's no cost reason to require that here.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS dependencies
        run: npm ci

      - name: Generate ApiConfig.kt from secrets
        env:
          FINANCE_SERVER_URL: ${{ secrets.FINANCE_SERVER_URL }}
          FINANCE_API_TOKEN: ${{ secrets.FINANCE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FINANCE_SERVER_URL:-}" ] || [ -z "${FINANCE_API_TOKEN:-}" ]; then
            echo "::error::FINANCE_SERVER_URL and/or FINANCE_API_TOKEN repository secrets are not set. Add them under Settings > Secrets and variables > Actions before running this workflow."
            exit 1
          fi
          python3 -c "
          import os
          with open('android-native/ApiConfig.kt.template') as f:
              content = f.read()
          content = content.replace('__FINANCE_SERVER_URL__', os.environ['FINANCE_SERVER_URL'])
          content = content.replace('__FINANCE_API_TOKEN__', os.environ['FINANCE_API_TOKEN'])
          with open('android-native/ApiConfig.kt', 'w') as f:
              f.write(content)
          "

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        working-directory: mobile/android
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No .apk found under app/build/outputs/apk/release" >&2
            find app/build/outputs -maxdepth 3 >&2 || true
            exit 1
          fi
          cp "$APK_PATH" "../FinanceTracker-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: mobile/FinanceTracker-release.apk
          retention-days: 14
