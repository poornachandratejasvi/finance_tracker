name: Build Unsigned Mobile IPA

# Produces an UNSIGNED iOS .ipa for the Expo app in mobile/ — for personal sideloading via
# LiveContainer (which loads unsigned app bundles itself, so no Apple Developer Program
# membership or code-signing certificate is needed anywhere in this pipeline). Not suitable
# for the App Store or TestFlight — those require Apple's real signing process.
#
# Manual trigger only: macOS runners consume Actions minutes at a 10x multiplier, so this
# never fires on an ordinary push — run it deliberately from the Actions tab when you want
# a fresh build.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install JS dependencies
        run: npm ci

      - name: Generate APIConfig.swift from secrets
        env:
          FINANCE_SERVER_URL: ${{ secrets.FINANCE_SERVER_URL }}
          FINANCE_API_TOKEN: ${{ secrets.FINANCE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FINANCE_SERVER_URL:-}" ] || [ -z "${FINANCE_API_TOKEN:-}" ]; then
            echo "::error::FINANCE_SERVER_URL and/or FINANCE_API_TOKEN repository secrets are not set. Add them under Settings > Secrets and variables > Actions before running this workflow."
            exit 1
          fi
          python3 -c "
          import os
          with open('ios-native/APIConfig.swift.template') as f:
              content = f.read()
          content = content.replace('__FINANCE_SERVER_URL__', os.environ['FINANCE_SERVER_URL'])
          content = content.replace('__FINANCE_API_TOKEN__', os.environ['FINANCE_API_TOKEN'])
          with open('ios-native/APIConfig.swift', 'w') as f:
              f.write(content)
          "

      - name: Generate native iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Build unsigned .app (code signing disabled)
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Package Payload/App.app into an .ipa
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          # Product lives at build/Build/Products/Release-iphoneos/<Scheme>.app -- two
          # levels down from build/Build/Products, not one.
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app product found under build/Build/Products" >&2
            find build/Build/Products -maxdepth 3 >&2 || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "../${SCHEME}-unsigned.ipa" Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-ipa
          path: mobile/*-unsigned.ipa
          retention-days: 14
